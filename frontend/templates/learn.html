<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learn ISL | Kaikural</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f8fc;
            color: #222;
        }

        .header {
            background: #ffffff;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e5e5;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #6c3cff;
        }

        .back-btn {
            text-decoration: none;
            color: #6c3cff;
            font-weight: 600;
        }

        .hero {
            text-align: center;
            padding: 55px 20px 35px;
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #666;
            font-size: 17px;
        }

        .section {
            width: 85%;
            max-width: 1100px;
            margin: auto;
            padding-bottom: 50px;
        }

        .section-title {
            font-size: 25px;
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e8e8e8;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .sign-box {
            width: 100%;
            height: 180px;
            background: #f0edff;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
        }

        .sign-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .placeholder {
            color: #6c3cff;
            font-size: 18px;
            font-weight: bold;
        }

        .card h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .meaning {
            color: #777;
            font-size: 15px;
        }

        @media (max-width: 600px) {
            .hero h1 {
                font-size: 30px;
            }

            .section {
                width: 92%;
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <div class="logo">
            KAIKURAL
        </div>

        <a href="/" class="back-btn">
            ← Back to Home
        </a>

    </header>


    <section class="hero">

        <h1>Learn Indian Sign Language</h1>

        <p>
            Learn basic ISL signs and improve your communication skills.
        </p>

    </section>


    <section class="section">

        <h2 class="section-title">
            Basic Words
        </h2>


        <div class="cards">


            <!-- HELLO -->

            <div class="card">

                <div class="sign-box">

                    <img
                        src="{{ url_for('static', filename='images/hello.jpeg') }}"
                        alt="ISL sign for Hello"
                    >

                </div>

                <h3>Hello</h3>

                <p class="meaning">
                    வணக்கம்
                </p>

            </div>



            <!-- THANK YOU -->

            <div class="card">

                <div class="sign-box">

                    <div class="placeholder">
                        THANK YOU
                    </div>

                </div>

                <h3>Thank You</h3>

                <p class="meaning">
                    நன்றி
                </p>

            </div>



            <!-- YES -->

            <div class="card">

                <div class="sign-box">

                    <div class="placeholder">
                        YES
                    </div>

                </div>

                <h3>Yes</h3>

                <p class="meaning">
                    ஆம்
                </p>

            </div>



            <!-- NO -->

            <div class="card">

                <div class="sign-box">

                    <div class="placeholder">
                        NO
                    </div>

                </div>

                <h3>No</h3>

                <p class="meaning">
                    இல்லை
                </p>

            </div>



            <!-- SORRY -->

            <div class="card">

                <div class="sign-box">

                    <div class="placeholder">
                        SORRY
                    </div>

                </div>

                <h3>Sorry</h3>

                <p class="meaning">
                    மன்னிக்கவும்
                </p>

            </div>


        </div>

    </section>

</body>

</html>
